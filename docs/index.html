<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RakhiAR Experience</title>
  <link href="index.css" rel="stylesheet">
  <script defer src="./packed.js"></script>
</head>
<body>
    <!-- Camera Session -->
    <canvas id="canvas" ></canvas>
    <video id="video" style="display: none;" autoplay muted playsinline></video>
    
  <!-- Form Setup -->
  <form id="rakhiForm" style="display: none;">
    <input type="text" id="sisterName" placeholder="Sister's Name" required>
    <input type="text" id="brotherName" placeholder="Brother's Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="mobile" placeholder="Mobile Number" required>
    <label><input type="checkbox" id="terms" required> I accept the terms and conditions.</label>
    <button type="submit">Send Digital Rakhi</button>
  </form>


</body>
</html>
