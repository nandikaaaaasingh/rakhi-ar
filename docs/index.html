<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RakhiAR Experience</title>
  <link href="index.css" rel="stylesheet">
  <script defer src="./packed.js"></script>
</head>
<body>
  <div class="container" id="senderContainer">
    <form id="rakhiForm" class="form-group">
      <div class="input-wrapper">
        <input id="sisterName" type="text" placeholder="Sister's Name" required>
      </div>
      <div class="input-wrapper">
        <input id="brotherName" type="text" placeholder="Brother's Name" required>
      </div>
      <div class="input-wrapper">
        <input id="email" type="email" placeholder="Email" required>
      </div>
      <div class="input-wrapper">
        <input id="mobile" type="tel" placeholder="Mobile Number" required>
      </div>
      <div class="input-wrapper">
        <label>
          <input id="terms" type="checkbox" required>
          I accept the terms and conditions.
        </label>
      </div>
      <div class="button-wrapper">
        <button type="submit" class="submit-button">Send Digital Rakhi</button>
      </div>
    </form>
  </div>
  <!-- Camera Session -->
  <canvas id="canvas"></canvas>
  <video id="video" style="display: none;" autoplay muted playsinline></video>
</body>
</html>
